# nastools ARM Agent 配置文件
# ============================================

relay:
  # Relay Server 地址 (公网 IP 或域名)
  url: "ws://198.19.105.56:18888"
  
  # Agent 密钥 (从 Relay Server /keys/generate 获取)
  agent_key: "ak_789c561c5793406780c7d383b072a1eb"

device:
  # 设备唯一 ID (留空则自动生成)
  id: "nvidia-01"
  
  # 设备名称
  name: "NVIDIA Jetson"
  
  # 设备类型
  type: "jetson"
  
  # 能力标签
  capabilities:
    - storage
    - network
    - system
    - ai

timing:
  # 心跳间隔 (毫秒)
  heartbeat_interval: 30000
  
  # 读取超时 (毫秒)
  read_timeout: 90000
  
  # 重连延迟 (秒)
  reconnect_delay: 5

diagnose:
  # 启动时执行诊断
  on_start: false
  
  # 定期诊断间隔 (秒), 0 表示禁用
  interval: 0
  
  # 诊断脚本路径
  script: "arm_diagnose.py"

log:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "DEBUG"
  
  # 日志文件路径 (空则输出到控制台)
  file: ""
