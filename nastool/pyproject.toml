[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nastool"
version = "5.0.2"
description = "ARM device diagnostic toolkit for AI-NAS Media Manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "AI-NAS Media Manager" },
]
keywords = ["nas", "arm", "diagnostic", "jetson", "rockchip", "ai-accelerator", "health-check"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Diagnostics",
]
dependencies = [
    "pyyaml>=5.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
jetson = ["jetson-stats>=4.0"]
rknn = ["rknn-toolkit2>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0", "black>=24.0", "isort>=5.0", "mypy>=1.0"]

[project.scripts]
nastool = "nastool.arm_diagnose:main"

[project.urls]
Homepage = "https://qizhiainas.com"
Documentation = "https://github.com/leon2397/qizhiainas/tree/main/arm/nastool"
Repository = "https://github.com/leon2397/qizhiainas"

[tool.setuptools.packages.find]
include = ["nastool*"]

[tool.setuptools.package-data]
nastool = ["py.typed", "version_db/versions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
