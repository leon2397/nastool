qnap-ts-264:
  name: "威联通 QNAP TS-264"
  vendor: "QNAP"
  category: "nas"
  cpu:
    cores: 4
    architecture: "x86_64"
    model: "Intel Celeron N5105"
    freq: "2.0 GHz"
  memory:
    total_gb: 4
    type: "DDR4"
    max_gb: 16
  storage:
    bays: 2
    max_capacity: "40 TB"
    raid_support: [single, jbod, raid0, raid1]
  network:
    ports: 2
    speed: "2.5 Gbps"
  ai:
    type: "gpu"   # 可加 GPU 模块
  checks:
    system:
      - python_version
      - pip_installed
      - system_libs
      - memory_check
      - cpu_temperature
      - uptime
    network:
      - internet_access
      - dns_resolve
      - nas_backend
      - nic_speed
      - port_conflict
    storage:
      - storage_disk
      - smart_health
      - hdd_temperature
      - write_speed
      - path_exists
    security:
      - login_failures
      - ssl_cert
      - firewall
      - ssh_root
  fixes:
    - install_python
    - config_dns
    - create_paths
    - enable_fail2ban
    - renew_ssl_cert
    - disable_root_login
    - setup_logrotate
    - cleanup_logs

