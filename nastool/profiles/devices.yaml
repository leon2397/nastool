# nastool Device Profiles
# Pre-configured diagnostic profiles for popular ARM NAS devices

version: "3.0"
last_updated: "2026-04-12"

# ============================================
# NVIDIA Jetson Series
# ============================================

jetson-xavier-nx:
  name: "NVIDIA Jetson Xavier NX"
  vendor: "NVIDIA"
  category: "ai-edge"
  cpu:
    cores: 6
    architecture: "arm64"
    model: "Carmel A78AE"
  gpu:
    type: "cuda"
    cores: 384
    compute_capability: "7.2"
  memory:
    total_gb: 8
    type: "LPDDR5"
  ai:
    type: "cuda"
    tflops: 6
  power:
    min_w: 10
    max_w: 20
    modes: ["10w", "15w", "maxn"]

  checks:
    system:
      - python_version
      - pip_installed
      - system_libs
      - memory_check
      - disk_space
    network:
      - internet_access
      - dns_resolve
      - nas_backend
      - port_conflict
    storage:
      - disk_space
      - write_speed
      - path_exists
    ai:
      - gpu_detected
      - cuda_version
      - jetpack_version
      - tensorrt_version
    security:
      - firewall
      - selinux
      - ssh_root

  fixes:
    - install_jetpack
    - set_power_mode
    - enable_cuda
    - configure_swap

  thresholds:
    disk_space_warning_gb: 30
    disk_space_critical_gb: 10
    memory_warning_gb: 1
    memory_critical_gb: 0.5
    write_speed_warning_mbps: 50
    write_speed_critical_mbps: 20
    cpu_temp_warning_c: 75
    cpu_temp_critical_c: 85
    gpu_temp_warning_c: 80
    gpu_temp_critical_c: 90

  benchmarks:
    - cpu_integer
    - memory_bandwidth
    - gpu_inference_resnet50
    - storage_seq_write
    - storage_rand_write

