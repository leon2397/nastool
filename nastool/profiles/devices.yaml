# ============================================
# Raspberry Pi Series
# ============================================

---

pi5:
  name: "Raspberry Pi 5"
  vendor: "Raspberry Pi"
  category: "sbc"
  cpu:
    cores: 4
    architecture: "arm64"
    model: "Cortex-A76"
  gpu:
    type: "videocore"
    model: "VideoCore VII"
  memory:
    total_gb: [2, 4, 8]
    type: "LPDDR4X"
  ai:
    type: "none"
  power:
    min_w: 3
    max_w: 8

  checks:
    system:
      - python_version
      - pip_installed
      - system_libs
      - memory_check
      - disk_space
      - cpu_governor
      - firmware_version
    network:
      - internet_access
      - dns_resolve
      - nas_backend
      - port_conflict
      - wifi_signal
    storage:
      - disk_space
      - write_speed
      - path_exists
      - sdcard_health
    ai:
      - none
    security:
      - firewall
      - selinux
      - ssh_root
      - default_password

  fixes:
    - update_firmware
    - configure_performance_governor
    - change_default_password
    - configure_swap

  thresholds:
    disk_space_warning_gb: 20
    disk_space_critical_gb: 5
    memory_warning_gb: 0.5
    memory_critical_gb: 0.2
    write_speed_warning_mbps: 30
    write_speed_critical_mbps: 10
    cpu_temp_warning_c: 70
    cpu_temp_critical_c: 80
    sdcard_health_warning_percent: 90
    sdcard_health_critical_percent: 95

  benchmarks:
    - cpu_integer
    - memory_bandwidth
    - storage_seq_write

