# ══════════════════════════════════════════════════════════════════
# Jetson 专用检测项
# ══════════════════════════════════════════════════════════════════

checks:
  # JetPack / L4T 版本
  system:
    - id: l4t_version
      name: "L4T 版本"
      command: "cat /etc/nv_tegra_release"
      parse: l4t_version
      
    - id: jetpack_version
      name: "JetPack 版本"
      command: "apt list --installed 2>/dev/null | grep nvidia-jetpack"
      
    - id: cuda_version
      name: "CUDA 版本"
      command: "nvcc --version | grep release"
      
    - id: cudnn_version
      name: "cuDNN 版本"
      command: "cat /usr/include/cudnn_version.h | grep CUDNN_MAJOR -A2"
      
  # GPU / AI 性能
  gpu:
    - id: gpu_freq
      name: "GPU 频率"
      command: "cat /sys/devices/gpu.0/devfreq/17000000.gpu/cur_freq"
      
    - id: gpu_temp
      name: "GPU 温度"
      command: "cat /sys/devices/virtual/thermal/thermal_zone*/temp"
      
    - id: jetson_clocks
      name: "性能模式状态"
      command: "jetson_clocks --show"
      
    - id: power_mode
      name: "电源模式"
      command: "nvpmodel -q"
      
  # 内存
  memory:
    - id: memory_usage
      name: "内存使用"
      command: "free -h"
      
    - id: emc_freq
      name: "EMC 频率"
      command: "cat /sys/kernel/debug/clk/emc/clk_rate"
      
  # 编码器
  encoders:
    - id: nvdec_available
      name: "NVDEC 可用"
      command: "ls -la /dev/nvdec*"
      
    - id: nvenc_available
      name: "NVENC 可用"
      command: "ls -la /dev/nvenc*"
      
    - id: nvjpg_available
      name: "NVJPG 可用"
      command: "ls -la /dev/nvjpg*"
      
  # TensorRT
  tensorrt:
    - id: trt_version
      name: "TensorRT 版本"
      command: "dpkg -l | grep nvinfer"
      
    - id: trt_plugins
      name: "TensorRT 插件"
      command: "ls /usr/lib/aarch64-linux-gnu/libnv*"
      
  # Python 环境
  python:
    - id: python_version
      name: "Python 版本"
      command: "python3 --version"
      
    - id: torch_version
      name: "PyTorch 版本"
      command: "python3 -c 'import torch; print(torch.__version__)'"
      optional: true
      
    - id: torch_cuda
      name: "PyTorch CUDA 支持"
      command: "python3 -c 'import torch; print(torch.cuda.is_available())'"
      optional: true
      
    - id: onnxruntime_version
      name: "ONNX Runtime 版本"
      command: "python3 -c 'import onnxruntime; print(onnxruntime.__version__)'"
      optional: true

# ══════════════════════════════════════════════════════════════════
# 性能调优配置
# ══════════════════════════════════════════════════════════════════

tuning:
  performance:
    name: "最高性能模式"
    commands:
      - "sudo nvpmodel -m 0"  # MAX NVP model
      - "sudo jetson_clocks"  # Max clocks
    power_watts: 60
    description: "最大功耗，最高性能"
    
  balanced:
    name: "平衡模式"
    commands:
      - "sudo nvpmodel -m 1"
      - "sudo jetson_clocks"
    power_watts: 30
    description: "性能与功耗平衡"
    
  power_save:
    name: "省电模式"
    commands:
      - "sudo nvpmodel -m 2"
    power_watts: 15
    description: "低功耗模式"

# ══════════════════════════════════════════════════════════════════
# 部署配置
# ══════════════════════════════════════════════════════════════════

deployment:
  native:
    install_dir: "/opt/ai-nas"
    service_name: "ai-nas-arm"
    pre_install:
      - "sudo apt-get update"
      - "sudo apt-get install -y python3-pip"
    pip_packages:
      - "fastapi>=0.100.0"
      - "uvicorn>=0.23.0"
      - "aiosqlite>=0.19.0"
      - "onnxruntime>=1.15.0"
      - "Pillow>=10.0.0"
    optional_packages:
      torch: "torch torchvision --index-url https://developer.download.nvidia.com/compute/redist/jp/"
      tensorrt: "tensorrt"
    service_port: 9999
    health_endpoint: "/health"
    
  docker:
    base_image: "nvcr.io/nvidia/l4t-pytorch:r36.2.0-py3"
    runtime: "nvidia"
    devices:
      - "/dev/nvdec0:/dev/nvdec0"
      - "/dev/nvenc0:/dev/nvenc0"
      - "/dev/nvjpg0:/dev/nvjpg0"
    volumes:
      - "/opt/ai-nas/data:/data"
      - "/nas:/nas:ro"
    ports:
      - "9999:9999"
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
