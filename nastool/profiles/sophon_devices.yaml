# ══════════════════════════════════════════════════════════════════
# SOPHON 专用检测项
# ══════════════════════════════════════════════════════════════════

checks:
  # SDK 版本
  system:
    - id: sophon_sdk_version
      name: "SophonSDK 版本"
      command: "cat /opt/sophon/version.txt"
      
    - id: bmcompiler_version
      name: "BMCompiler 版本"
      command: "bm_compiler --version"
      
    - id: bmruntime_version
      name: "BMRuntime 版本"
      command: "bm_runtime --version"
      
  # TPU 状态
  tpu:
    - id: tpu_available
      name: "TPU 可用"
      command: "ls /dev/bm*"
      
    - id: tpu_utilization
      name: "TPU 利用率"
      command: "bm-smi"
      
    - id: tpu_memory
      name: "TPU 内存"
      command: "bm-smi --memory"
      
  # 视频编解码
  video:
    - id: vpu_decode
      name: "视频解码能力"
      command: "cat /proc/bm-vpu/decode"
      optional: true
      
    - id: vpu_encode
      name: "视频编码能力"
      command: "cat /proc/bm-vpu/encode"
      optional: true
      
  # Python 环境
  python:
    - id: python_version
      name: "Python 版本"
      command: "python3 --version"
      
    - id: sophon_python
      name: "Sophon Python 库"
      command: "python3 -c 'import sophon; print(sophon.__version__)'"
      optional: true
      
    - id: bmtorch_version
      name: "BMtorch 版本"
      command: "python3 -c 'import bmtorch; print(bmtorch.__version__)'"
      optional: true

# ══════════════════════════════════════════════════════════════════
# 模型编译配置
# ══════════════════════════════════════════════════════════════════

model_compile:
  # 模型转换流程
  workflow:
    - step: 1
      name: "模型导出"
      description: "PyTorch/TensorFlow → ONNX"
      tools: ["torch.onnx.export", "tf2onnx"]
      
    - step: 2
      name: "模型优化"
      description: "ONNX 优化"
      tools: ["onnx-simplifier", "onnxoptimizer"]
      
    - step: 3
      name: "模型编译"
      description: "ONNX → bmodel"
      tools: ["bm_compile"]
      command: "bm_compile --model input.onnx --output output.bmodel --target {chip}"
      
    - step: 4
      name: "模型部署"
      description: "加载 bmodel 推理"
      tools: ["bmruntime"]
      
  # 支持的模型格式
  supported_formats:
    input: ["onnx", "tflite", "caffe", "mxnet"]
    output: ["bmodel"]
    
  # 量化配置
  quantization:
    methods: ["int8", "fp16", "fp32"]
    calibration: true
    mixed_precision: true

# ══════════════════════════════════════════════════════════════════
# 部署配置
# ══════════════════════════════════════════════════════════════════

deployment:
  native:
    install_dir: "/opt/ai-nas"
    service_name: "ai-nas-sophon"
    pre_install:
      - "apt-get update"
      - "apt-get install -y python3-pip"
    pip_packages:
      - "fastapi>=0.100.0"
      - "uvicorn>=0.23.0"
      - "sophon>=2.0.0"
    environment:
      SOPHON_SDK_PATH: "/opt/sophon"
      LD_LIBRARY_PATH: "/opt/sophon/lib:$LD_LIBRARY_PATH"
    service_port: 9999
    
  docker:
    base_image: "sophgo/tpu-runtime:latest"
    devices:
      - "/dev/bmdev0:/dev/bmdev0"
      - "/dev/bmdev1:/dev/bmdev1"
    volumes:
      - "/opt/ai-nas/data:/data"
      - "/opt/sophon:/opt/sophon:ro"
      - "/nas:/nas:ro"
    ports:
      - "9999:9999"
    environment:
      SOPHON_SDK_PATH: "/opt/sophon"
