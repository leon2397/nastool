# ══════════════════════════════════════════════════════════════════
# 检测项配置（群晖专用）
# ══════════════════════════════════════════════════════════════════

checks:
  # 系统检测
  system:
    - id: dsm_version
      name: "DSM 版本"
      command: "synogetkeyvalue /etc.defaults/VERSION majorversion"
      expected: "7"
      severity: warning
      
    - id: dsm_build
      name: "DSM 构建号"
      command: "synogetkeyvalue /etc.defaults/VERSION smallfixnumber"
      
    - id: uptime
      name: "运行时间"
      command: "uptime -p"
      
  # 存储检测
  storage:
    - id: volume_status
      name: "存储卷状态"
      command: "cat /proc/mdstat"
      parse: raid_status
      
    - id: disk_smart
      name: "磁盘 SMART 状态"
      command: "syno_disk_smart --status"
      severity: critical
      
    - id: disk_temp
      name: "磁盘温度"
      command: "syno_disk_temperature"
      
    - id: volume_usage
      name: "存储卷使用率"
      command: "df -h | grep volume"
      
  # 网络检测
  network:
    - id: network_interface
      name: "网络接口状态"
      command: "ip link show"
      
    - id: bond_status
      name: "链路聚合状态"
      command: "cat /proc/net/bonding/bond0"
      optional: true
      
  # 服务检测
  services:
    - id: docker_status
      name: "Docker 服务状态"
      command: "synoservicectl --status pkgctl-Docker"
      optional: true
      arch: x86_64
      
    - id: web_status
      name: "Web 服务状态"
      command: "synoservicectl --status httpd-syno"
      
    - id: smb_status
      name: "SMB 服务状态"
      command: "synoservicectl --status smb"
      
  # Python 环境
  python:
    - id: python_version
      name: "Python 版本"
      command: "python3 --version"
      expected: "3."
      
    - id: pip_available
      name: "pip 可用"
      command: "pip3 --version"
      
  # Docker 环境（仅 x86）
  docker:
    - id: docker_version
      name: "Docker 版本"
      command: "docker --version"
      arch: x86_64
      
    - id: docker_running
      name: "Docker 运行状态"
      command: "docker ps"
      arch: x86_64
      
    - id: compose_available
      name: "Docker Compose 可用"
      command: "docker-compose --version"
      arch: x86_64
      optional: true

# ══════════════════════════════════════════════════════════════════
# 部署配置
# ══════════════════════════════════════════════════════════════════

deployment:
  # Docker 部署（x86 机型）
  docker:
    pre_install:
      - "synopkg install Docker"
      - "synoservicectl --start pkgctl-Docker"
    compose_path: "/volume1/docker/ai-nas"
    volumes:
      - "/volume1/docker/ai-nas/data:/data"
      - "/volume1:/nas:ro"
    ports:
      - "8000:8000"
    environment:
      NAS_PATH: "/nas"
      TZ: "Asia/Shanghai"
      
  # 原生部署（ARM 机型）
  native:
    install_dir: "/volume1/@appstore/ai-nas"
    service_name: "ai-nas-arm"
    pre_install:
      - "mkdir -p /volume1/@appstore/ai-nas"
      - "mkdir -p /volume1/@appstore/ai-nas/data"
    post_install:
      - "chmod +x /volume1/@appstore/ai-nas/arm_server.py"
    service_template: |
      [Unit]
      Description=AI-NAS ARM Service
      After=network.target
      
      [Service]
      Type=simple
      ExecStart=/usr/bin/python3 {install_dir}/arm_server.py --port 9999 --nas-path /volume1
      Restart=on-failure
      RestartSec=10
      
      [Install]
      WantedBy=multi-user.target
