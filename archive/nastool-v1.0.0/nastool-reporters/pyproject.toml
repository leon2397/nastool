[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nastool-reporters"
version = "1.0.0"
description = "NASTool Reporters - Terminal, HTML, JSON, Markdown Output Formats"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "NASTool Team"}
]
dependencies = [
    "nastool-common>=1.0.0",
    "nastool-core>=1.0.0",
    "jinja2>=3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nastool_reporters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
