[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nastool-cli"
version = "1.0.0"
description = "NASTool CLI - Command Line Interface for System Diagnostics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "NASTool Team"}
]
dependencies = [
    "nastool-common>=1.0.0",
    "nastool-core>=1.0.0",
    "nastool-adapters>=1.0.0",
    "nastool-fixes>=1.0.0",
    "nastool-reporters>=1.0.0",
]

[project.scripts]
nastool = "nastool_cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nastool_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
