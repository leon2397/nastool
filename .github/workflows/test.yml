name: Test CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Install packages in development mode
      run: |
        pip install -e ./nastool-common[dev]
        pip install -e ./nastool-core[dev]
        pip install -e ./nastool-adapters[dev]
        pip install -e ./nastool-fixes[dev]
        pip install -e ./nastool-reporters[dev]
        pip install -e ./nastool-cli[dev]

    - name: Run tests with pytest
      run: |
        pytest --cov=nastool_core --cov=nastool_cli --cov=nastool_adapters --cov=nastool_common --cov=nastool_fixes -v

    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella