# nastool 发布
#
# 由 tag 触发（v*）。分两步：
#   1. 创建 GitHub Release —— 附上构建好的包
#   2. 发布到 PyPI —— 可选，需要配置 trusted publishing
#
# **PyPI 发布默认关闭**，需要你在仓库设置里配好
# `pypi` environment 的 trusted publisher 后，把下面的 `publish-pypi` job
# 的 `if` 条件去掉即可。在此之前发包请用本地 `twine upload`。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.4.0）'
        required: true

permissions:
  contents: write   # 创建 Release 需要

jobs:
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来生成变更日志

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: 构建产物
        run: python -m build

      - name: 生成变更日志
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log --pretty="- %s" "$PREV..$TAG" > NOTES.md
          else
            git log --pretty="- %s" --max-count=30 > NOTES.md
          fi
          echo "" >> NOTES.md
          echo "详细变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md)" >> NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  publish-pypi:
    name: 发布到 PyPI
    runs-on: ubuntu-latest
    needs: release
    # 默认关闭。配置好 PyPI trusted publisher 后，把这行改成：
    #   if: startsWith(github.ref, 'refs/tags/v')
    if: false
    environment: pypi
    permissions:
      id-token: write   # OIDC，PyPI trusted publishing 需要
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: 构建产物
        run: python -m build

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
