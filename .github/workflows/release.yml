name: Release CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build packages
      run: |
        cd nastool-common && python -m build
        cd ../nastool-core && python -m build
        cd ../nastool-adapters && python -m build
        cd ../nastool-fixes && python -m build
        cd ../nastool-reporters && python -m build
        cd ../nastool-cli && python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload nastool-common/dist/*
        twine upload nastool-core/dist/*
        twine upload nastool-adapters/dist/*
        twine upload nastool-fixes/dist/*
        twine upload nastool-reporters/dist/*
        twine upload nastool-cli/dist/*

  create-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate release notes
      run: |
        git log --oneline --format="- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD > RELEASE_NOTES.md

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false